<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Elevate Marketing Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google tag (gtag.js) -->
   <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0CEWRXQM13"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0CEWRXQM13');
</script>
  </head>
  <body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-md">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <a href="index.html" class="text-2xl font-bold text-blue-600"
          >Elevate Marketing</a
        >
        <div class="space-x-6">
          <a
            href="index.html"
            class="text-gray-700 hover:text-blue-600 font-medium"
            >Home</a
          >
          <a
            href="services.html"
            class="text-gray-700 hover:text-blue-600 font-medium"
            >Services</a
          >
          <a
            href="contact.html"
            class="text-blue-600 font-medium border-b-2 border-blue-600 pb-1"
            >Contact</a
          >
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-16 px-4">
      <div
        class="bg-white p-10 rounded-lg shadow-lg w-full max-w-lg border border-gray-100"
      >
        <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">
          Let's Grow Together
        </h1>
        <p class="text-gray-500 text-center mb-8">
          Fill out the form below and our team will get back to you within 24
          hours.
        </p>

        <form
          id="contact-form"
          class="space-y-6"
          onsubmit="
            event.preventDefault();
            alert(
              'Form submitted! (This is a dummy form for tracking demonstration)',
            );
          "
        >
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Full Name</label
            >
            <input
              type="text"
              id="name"
              name="name"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Email Address</label
            >
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <div>
            <label
              for="company"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Company / Website URL</label
            >
            <input
              type="text"
              id="company"
              name="company"
              class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <div>
            <label
              for="service"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Primary Interest</label
            >
            <select
              id="service"
              name="service"
              class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white"
            >
              <option value="general">General Inquiry</option>
              <option value="seo">SEO Optimization</option>
              <option value="ppc">Paid Advertising</option>
              <option value="analytics">Analytics & Tracking</option>
            </select>
          </div>

          <button
            type="submit"
            id="btn-submit-lead"
            class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition shadow-md"
          >
            Submit Request
          </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
          <p>
            Or call us directly at
            <a
              href="tel:+15551234567"
              id="link-phone"
              class="text-blue-600 font-medium hover:underline"
              >+1 (555) 123-4567</a
            >
          </p>
          <p class="mt-1">
            Email:
            <a
              href="mailto:hello@elevatemarketing.demo"
              id="link-email"
              class="text-blue-600 font-medium hover:underline"
              >hello@elevatemarketing.demo</a
            >
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
      <div class="max-w-6xl mx-auto px-4 text-center">
        <p>&copy; 2026 Elevate Marketing Agency. Educational Demo.</p>
      </div>
    </footer>

    <script>
      // Pre-select the service dropdown if a query parameter is present (e.g., ?service=seo)
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const serviceParam = urlParams.get("service");
        if (serviceParam) {
          const selectElement = document.getElementById("service");
          if (selectElement) {
            selectElement.value = serviceParam;
          }
        }
      });
    </script>
  </body>
</html>
